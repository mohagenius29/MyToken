name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyToken.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyToken.apk --prerelease \
            --title "MyToken - latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}. Download MyToken.apk and install it on your Android phone."
